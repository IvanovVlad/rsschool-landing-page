<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rsschool-landing-page/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>rsschool-landing-page</title>
    <link rel="stylesheet" type="text/css" href="/rsschool-landing-page/font/index.css" />
    <script type="module" crossorigin src="/rsschool-landing-page/assets/menu-BfQiBfTe.js"></script>
    <link rel="modulepreload" crossorigin href="/rsschool-landing-page/assets/theme-ChqYFPy0.js">
    <link rel="stylesheet" crossorigin href="/rsschool-landing-page/assets/theme-BkA3_W4z.css">
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <a href="/rsschool-landing-page">
          <img src="/rsschool-landing-page/logo.png" alt="COFFEE HOUSE logo" class="logo" data-theme="hide-light" />
          <img src="/rsschool-landing-page/logo-dark.png" alt="COFFEE HOUSE logo" class="logo" data-theme="hide-dark" />
        </a>
        <ul class="nav-menu">
          <li>
            <a href="/rsschool-landing-page#favorite-coffee" class="nav-link">Favorite coffee</a>
          </li>
          <li>
            <a href="/rsschool-landing-page#about" class="nav-link">About</a>
          </li>
          <li>
            <a href="/rsschool-landing-page#download-app" class="nav-link">Mobile app</a>
          </li>
          <li>
            <a href="/rsschool-landing-page/menu.html#contacts" class="nav-link">Contact us</a>
          </li>
        </ul>
        <div class="nav-controls">
          <div class="theme-toggle">
            <button
              onclick="setLightTheme()"
              class="theme-toggle-btn active-light"
              aria-label="Light mode"
            >
              <img src="/rsschool-landing-page/icons/sun.svg" alt="sun" />
            </button>
            <button
              onclick="setDarkTheme()"
              class="theme-toggle-btn active-dark"
              aria-label="Dark mode"
            >
              <img src="/rsschool-landing-page/icons/moon.svg" alt="" data-theme="hide-light" />
              <img src="/rsschool-landing-page/icons/moon-inverse.svg" alt="" data-theme="hide-dark" />
            </button>
          </div>
          <button class="menu-button menu-button-active">
            <span>Menu</span>
            <img src="/rsschool-landing-page/icons/coffee-cup.svg" alt="coffee cup" data-theme="hide-light" />
            <img src="/rsschool-landing-page/icons/coffee-cup-inverse.svg" alt="coffee cup" data-theme="hide-dark" />
          </button>
          <button class="button-secondary menu-mobile-toggle">
            <img src="/rsschool-landing-page/icons/menu-mobile-closed.svg" alt="menu-mobile-closed" />
          </button>
        </div>
      </nav>
    </header>
    <main class="main">
      <h1 class="section-header menu-title">
        Behind each of our cups hides an <span class="italic color-accent">amazing surprise</span>
      </h1>
      <div>
        <div>
          <div class="menu-selector">
            <div class="menu-selector-item menu-selector-item-active" id="categories-coffee">
              <div class="menu-selector-icon"><img src="/rsschool-landing-page/coffee-category.png" alt="coffee" /></div>
              <div>Coffee</div>
            </div>
            <div class="menu-selector-item" id="categories-tea">
              <div class="menu-selector-icon"><img src="/rsschool-landing-page/tea-category.png" alt="tea" /></div>
              <div>Tea</div>
            </div>
            <div class="menu-selector-item" id="categories-dessert">
              <div class="menu-selector-icon">
                <img src="/rsschool-landing-page/dessert-category.png" alt="dessert" />
              </div>
              <div>Dessert</div>
            </div>
          </div>
        </div>
        <div class="price-cards" id="products-container"></div>
      </div>
    </main>
    <footer class="footer" id="contacts">
      <div class="footer-combo">
        <div class="footer-item footer-item-left">
          <h2 class="section-header no-margin">
            <span class="color-inverse italic">Sip, Savor, Smile.</span>
            <span class="color-accent italic">It’s coffee time!</span>
          </h2>
          <div class="contact-socials">
            <a class="button-social social-twitter" href="https://twitter.com" target="_blank"></a>
            <a
              class="button-social social-instagram"
              href="https://instagram.com"
              target="_blank"
            ></a>
            <a
              class="button-social social-facebook"
              href="https://facebook.com"
              target="_blank"
            ></a>
          </div>
        </div>
        <div class="footer-item">
          <div class="contact-title">Contact us</div>
          <div>
            <div class="contact-combo">
              <img src="/rsschool-landing-page/icons/location.svg" alt="location marker" />
              <a href="#" class="contact-link">8558 Green Rd., LA</a>
            </div>
            <div class="contact-combo">
              <img src="/rsschool-landing-page/icons/phone.svg" alt="phone icon" />
              <a href="tel:16035550123" class="contact-link">+1 (603) 555-0123</a>
            </div>
            <div class="contact-combo">
              <img width="20" height="20" src="/rsschool-landing-page/icons/clock.svg" alt="clock icon" />
              <a href="#" class="contact-link">Mon–Sat: 9:00–23:00</a>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
