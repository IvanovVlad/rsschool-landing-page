<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/rsschool-landing-page/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>rsschool-landing-page</title>
    <link rel="stylesheet" type="text/css" href="/rsschool-landing-page/font/index.css"/>
  <link rel="stylesheet" crossorigin href="/rsschool-landing-page/assets/style-DWni6aJl.css">
</head>
<body>
<header class="header">
    <nav class="nav">
        <img src="/rsschool-landing-page/logo.png" alt="COFFEE HOUSE logo" class="logo"/>
        <ul class="nav-menu">
            <li>
                <a href="#" class="nav-link">Favorite coffee</a>
            </li>
            <li>
                <a href="#" class="nav-link">About</a>
            </li>
            <li>
                <a href="#" class="nav-link">Mobile app</a>
            </li>
            <li>
                <a href="#" class="nav-link">Contact us</a>
            </li>
        </ul>
        <div class="nav-controls">
            <div class="theme-toggle">
                <button class="theme-toggle-btn active" aria-label="Light mode">
                    <img src="/rsschool-landing-page/icons/sun.svg" alt="sun"/>
                </button>
                <button class="theme-toggle-btn" aria-label="Dark mode">
                    <img src="/rsschool-landing-page/icons/moon.svg" alt="moon"/>
                </button>
            </div>
            <button class="menu-button">
                <span>Menu</span>
                <img src="/rsschool-landing-page/icons/cofee-cup.svg" alt="coffee cup"/>
            </button>
        </div>
    </nav>
</header>
<main class="main">
    <h1 class="section-header menu-title">
        Behind each of our cups hides an <span class="italic color-accent">amazing surprise</span>
    </h1>
    <div>
        <div>
            <div>
                <div></div>
                <div>Coffee</div>
            </div>
        </div>
    </div>
</main>
<footer class="footer">
    <div class="footer-combo">
        <div class="footer-item footer-item-left">
            <h2 class="section-header no-margin">
                <span class="color-inverse italic">Sip, Savor, Smile.</span>
                <span class="color-accent italic">It’s coffee time!</span>
            </h2>
            <div class="contact-socials">
                <div class="button-social social-twitter"></div>
                <div class="button-social social-instagram"></div>
                <div class="button-social social-facebook"></div>
            </div>
        </div>
        <div class="footer-item">
            <div class="contact-title">Contact us</div>
            <div>
                <div class="contact-combo">
                    <img src="/rsschool-landing-page/icons/location.svg" alt="location marker"/>
                    <span>8558 Green Rd., LA</span>
                </div>
                <div class="contact-combo">
                    <img src="/rsschool-landing-page/icons/phone.svg" alt="phone icon"/>
                    <span>+1 (603) 555-0123</span>
                </div>
                <div class="contact-combo">
                    <img width="20" height="20" src="/rsschool-landing-page/icons/clock.svg" alt="clock icon"/>
                    <span>Mon–Sat: 9:00–23:00</span>
                </div>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
